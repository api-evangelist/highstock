aid: highstock
name: Highstock
description: >-
  Highstock is a private, AI-native wholesale marketplace that connects consumer
  brands holding excess or unsold inventory with a vetted network of global
  business buyers. Focused initially on beauty and personal care, the platform
  lets brands convert surplus stock into cash while protecting brand value and
  channel privacy, and gives buyers access to authentic inventory directly from
  brands at exclusive pricing, with centralized order management and flexible
  payment terms. The company reports 50+ beauty and personal care brands, 100+
  wholesale buyers, $100M+ in listed inventory, and more than 1M pounds of
  product diverted from landfill, with offices in New York (US) and Gurgaon
  (India). Highstock does not currently publish a public API or developer
  program; this profile captures its public web identity and domain-security
  posture. Added to the API Evangelist network as a portfolio lead for
  enrichment.
